[project]
name = "infra-request-orchestrator"
version = "0.1.0"
description = "End-to-end orchestration of an infrastructure request with Camunda 8, ServiceNow, Jira, Kubernetes and AI agents, for a fictional company (NetCo)."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "anthropic==1.13.0",
    "camunda-orchestration-sdk==10.0.0",
    "httpx>=0.28.1",
    "httpx2==2.13.1",
    "kubernetes>=37,<38",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.4",
    "pyvmomi==9.1.1.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stack", "src/integrations", "src/netco", "src/k8s", "src/workers", "src/scenario", "src/agents", "src/evals", "src/vsphere", "src/metrics", "src/diagrams"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["recorded: replays a cassette of real API calls (re-record with `make record`)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
