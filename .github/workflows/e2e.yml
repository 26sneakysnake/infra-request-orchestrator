name: e2e

# Runs the whole scenario against the real ServiceNow developer instance and Jira site: each run
# creates 4 requests, 4 changes and 4 Jira issues there, each with 2 Markdown attachments.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bpmn/**"
      - "src/**"
      - "referentiel/**"
      - "infra/**"
      - "cassettes/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

# Never two runs at once against the same ServiceNow and Jira instances.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICENOW_INSTANCE_URL: ${{ secrets.SERVICENOW_INSTANCE_URL }}
      SERVICENOW_USERNAME: ${{ secrets.SERVICENOW_USERNAME }}
      SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: NETOPS
      CAMUNDA_REST_ADDRESS: http://localhost:8080
      # The qualification agent replays recorded answers: no Anthropic key in CI.
      NETCO_LLM_MODE: replay
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # setup-uv publishes no floating major tag
      - run: make setup
      - name: Check ServiceNow and Jira access (fails fast if the developer instance is asleep)
        run: make verify
      - uses: helm/kind-action@v1.15.1
        with:
          install_only: true
          version: v0.33.0
      - run: make kind-up
      - run: make up
      - run: make deploy-bpmn
      - run: make e2e
      # The worker log goes to the job log, where GitHub masks the secrets, never to the artifact.
      - name: Diagnostics
        if: failure()
        run: |
          tail -n 150 out/e2e-workers.log || true
          kubectl --context kind-netco get pods,svc,networkpolicy -A || true
          docker compose logs --no-color --tail 200 orchestration || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: out/e2e-report.json
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: |
          make kind-down || true
          docker compose down -v
