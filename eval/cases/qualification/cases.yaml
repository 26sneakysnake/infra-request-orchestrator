# Qualification agent evaluation: 30 synthetic requests for the fictional company NetCo.
# Frozen: cases.sha256 holds the SHA-256 of this file and `make eval` refuses to run if it changed.
# Do not edit by hand (CLAUDE.md); a new version of the set gets a new file and a new hash.
#
# expected:
#   fields scored one by one (null or [] = must stay empty); ports and networks compared as sets.
#   missing: required fields the process must ask for (after merging with the form).
#   verdict: final decision of the process on the merged fields:
#            valid | missing | out_of_scope | a rule id expected among the rejection reasons.

- id: Q01
  category: claire
  text: >-
    Bonjour, pouvez-vous exposer catalogue-api en dev, en interne, sur le port 8080/tcp, pour le
    réseau des développeurs 10.20.0.0/16 ? Pas de VM. Merci.
  expected:
    service_name: catalogue-api
    environment: dev
    exposure: interne
    ports: [8080/tcp]
    source_networks: [10.20.0.0/16]
    vm_required: false
    vm_size: null
    urgent: false
    missing: []
    verdict: valid

