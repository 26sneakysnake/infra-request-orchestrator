# NetCo reference rules (fictional company). Source of truth read by the code.
# The Markdown files next to this one explain each rule (same identifiers) for humans and for the
# qualification agent of phase P3. tests/test_referentiel.py keeps both in sync.

naming:
  service_pattern: "^[a-z][a-z0-9-]{2,30}$"   # NOM-01
  namespace_template: "svc-{service}-{environment}"   # NOM-02

environments: [dev, recette, prod]   # ENV-01

exposures: [interne, externe]   # EXP-01

ports:
  protocols: [tcp]   # PORT-04
  max_per_request: 1   # PORT-03 (demo limit)
  forbidden:   # PORT-01
    21: FTP en clair
    22: SSH
    23: Telnet
    445: SMB
    3389: RDP
  allowed:   # PORT-02
    interne: [443, 3306, 5432, 6379, 8080, 8443, 9090]
    externe: [443]
  sensitive: [3306, 5432, 6379]   # PORT-05

zones:   # ZONE-01, ZONE-02
  dev: 10.20.0.0/16
  data: 10.30.0.0/16
  finance: 10.40.12.0/24
  bureautique: 10.50.0.0/16
  internet: 0.0.0.0/0

vm:   # VM-01 (referentiel/infrastructure/vm.md)
  sizes:
    S: {cpu: 1, memory_mb: 2048}
    M: {cpu: 2, memory_mb: 4096}
    L: {cpu: 4, memory_mb: 8192}
  folder_template: "netco/{environment}"
  name_template: "{service}-{environment}-vm"
  network: VM Network
